# MIRFLICKR 1M base: index_1m/tags.csv (id,tags) -> Elasticsearch index "mirflickr"
#   docker compose run --rm logstash -f /usr/share/logstash/pipeline/mirflickr.conf
input {
  file {
    path => "/data/mirflickr/tags.csv"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/mirflickr_done.log"
    exit_after_read => true
  }
}
filter {
  csv {
    separator => ","
    columns => ["id", "tags"]
    skip_header => true
  }
  mutate {
    convert => { "id" => "integer" }
    add_field => { "label" => "unlabeled" }
    remove_field => ["message", "@version", "@timestamp", "host", "log", "event"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mirflickr"
    document_id => "%{id}"
  }
}

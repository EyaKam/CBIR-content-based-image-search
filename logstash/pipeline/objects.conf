# Objects base: index/objects.csv (id,path,label,tags) -> Elasticsearch index "objects"
#   docker compose run --rm logstash -f /usr/share/logstash/pipeline/objects.conf
input {
  file {
    path => "/data/objects/objects.csv"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/objects_done.log"
    exit_after_read => true
  }
}
filter {
  csv {
    separator => ","
    columns => ["id", "path", "label", "tags"]
    skip_header => true
  }
  mutate {
    convert => { "id" => "integer" }
    remove_field => ["message", "@version", "@timestamp", "host", "log", "event"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "objects"
    document_id => "%{id}"
  }
}
